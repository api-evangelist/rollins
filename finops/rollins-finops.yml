description: >-
  Rollins is a services company; any API integration is partner-contract driven, not
  usage-metered. FinOps shape is placeholder.
notes: >-
  No public billing or usage API exists. Service costs are governed by service contracts and
  billed through standard AR/AP, not as itemized API line items.
sources:
  - https://www.rollins.com/
billingModel:
  pricingCategory: Contract-Based
  billingFrequency: Per Contract
  billingCurrency: USD
  chargeCategories:
    - Purchase
