  BillingCurrency: USD
meters:
  - name: contract_charges
    description: Negotiated partner or service charges
    unit: varies
    aggregation: sum
    dimensions:
      - contract
principles:
  - name: Visibility
    description: >-
      Track Rollins-related spend through the AP system and field-services contracts; no API
      usage telemetry is available.
  - name: Allocation
    description: >-
      Allocate Rollins service charges to the property or facility receiving service rather
      than to a generic IT bucket.
  - name: Optimization
    description: >-
      Negotiate multi-site or multi-year discounts at contract renewal; review service scope
      against actual incident frequency.
  - name: Accountability
    description: >-
      Facilities or property-management leads own the Rollins relationship and review service
      contracts annually.
