specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Rollins
providerId: rollins
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Pest Control
  - Services
  - Rate Limiting
description: >-
  Rollins does not publish rate limits. Throttling, if applied, is defined per partner
  contract.
notes: >-
  No public rate-limit documentation exists.
sources:
  - https://www.rollins.com/
responseCodes:
  throttled: 429
limits:
  - name: Partner-contract throttling
    scope: account
    metric: varies
    limit: see partner agreement
    notes: >-
      Any rate or burst limit is governed by the executed partner agreement.
policies:
  - name: Partner Agreement Governance
    description: >-
      Rate, retry, and SLA behavior is governed by the partner contract rather than a
      published API policy.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
